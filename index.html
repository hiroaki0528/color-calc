<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配合グラム計算</title>

<style>
body {
font-family: sans-serif;
background: #0b1220;
color: #fff;
display: flex;
justify-content: center;
}
.container {
width: 360px;
padding: 20px;
}
h1 { font-size: 18px; }
label { font-size: 12px; color: #9fb0d0; }
input {
width: 100%;
padding: 10px;
margin: 6px 0 12px;
font-size: 16px;
}
button {
width: 100%;
padding: 12px;
font-size: 16px;
background: #1e2e55;
color: #fff;
border: none;
border-radius: 6px;
}
.item {
display: flex;
justify-content: space-between;
border-bottom: 1px solid #333;
padding: 6px 0;
}
</style>
</head>

<body>
<div class="container">
<h1>配合グラム計算</h1>

<label>総量（g）</label>
<input id="total" type="number" value="80">

<label>配合比率（例：2:1:1:5%:5%:1%）</label>
<input id="ratio" value="2:1:1:5%:5%:1%">

<button onclick="calc()">計算</button>
<div id="result"></div>
</div>

<script>
function calc(){
const total = Number(document.getElementById("total").value);
const parts = document.getElementById("ratio").value.split(":");
let percentSum = 0, ratioSum = 0;

parts.forEach(p=>{
if(p.includes("%")) percentSum += parseFloat(p);
else ratioSum += parseFloat(p);
});

const remain = total - total * percentSum / 100;
let html = "";

parts.forEach((p,i)=>{
let g = p.includes("%")
? total * parseFloat(p)/100
: remain * parseFloat(p)/ratioSum;
html += `<div class="item"><div>${String.fromCharCode(65+i)}</div><div>${g.toFixed(1)} g</div></div>`;
});

document.getElementById("result").innerHTML = html;
}
</script>
</body>
</html>
